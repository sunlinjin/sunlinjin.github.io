<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <div class="logo" id="nav-name"></div>
      <ul>
        <li><a href="#about">关于</a></li>
        <li><a href="#skills">技能</a></li>
        <li><a href="#projects">项目</a></li>
        <li><a href="#experience">经历</a></li>
        <li><a href="#contact">联系</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero" id="hero">
    <h1 id="hero-name"></h1>
    <p class="subtitle" id="hero-title"></p>
    <p class="tagline" id="hero-tagline"></p>
  </section>

  <section id="about" class="section">
    <h2>关于我</h2>
    <p id="about-text"></p>
  </section>

  <section id="skills" class="section">
    <h2>技能</h2>
    <div id="skills-container" class="skills-grid"></div>
  </section>

  <section id="projects" class="section">
    <h2>项目</h2>
    <div id="projects-container" class="cards"></div>
  </section>

  <section id="experience" class="section">
    <h2>工作经历</h2>
    <div id="experience-container"></div>
  </section>

  <section id="contact" class="section">
    <h2>联系我</h2>
    <div id="contact-container" class="contact-links"></div>
  </section>

  <footer>
    <p>© <span id="year"></span> | 嵌入式软件工程师</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
